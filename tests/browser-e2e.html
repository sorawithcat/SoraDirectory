<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SoraDirectory browser E2E</title>
    <style>
        body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
        #status { padding: 10px; white-space: pre-wrap; }
        iframe { width: 1200px; height: 760px; border: 0; }
        body[data-viewport="mobile"] iframe { width: 360px; height: 720px; }
    </style>
</head>
<body data-test-status="running">
    <pre id="status">启动中…</pre>
    <iframe id="app" title="测试应用"></iframe>
    <script>
        (async function() {
            const params = new URLSearchParams(location.search);
            const viewport = params.get('viewport') === 'mobile' ? 'mobile' : 'desktop';
            document.body.dataset.viewport = viewport;
            const status = document.getElementById('status');
            const frame = document.getElementById('app');
            const log = [];
            const failures = [];
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            const poll = async (check, timeout = 12000) => {
                const started = performance.now();
                while (performance.now() - started < timeout) {
                    try { const result = check(); if (result) return result; } catch (_) {}
                    await wait(50);
                }
                throw new Error('等待超时');
            };
            const check = (condition, label, detail = '') => {
                if (!condition) failures.push(`${label}${detail ? `：${detail}` : ''}`);
                log.push(`${condition ? 'PASS' : 'FAIL'} ${label}${detail ? ` · ${detail}` : ''}`);
            };
            window.addEventListener('error', event => failures.push(`父页面错误：${event.message}`));
            window.addEventListener('unhandledrejection', event => failures.push(`父页面异步错误：${event.reason?.message || event.reason}`));
            try {
                localStorage.removeItem('sora_extension_packs_v1');
                frame.src = `../index.html?test=browser-e2e-${viewport}-${Date.now()}`;
                await poll(() => frame.contentWindow?.SoraMethodWorkbench && frame.contentWindow?.SoraKnowledgeBaseInterop);
                const win = frame.contentWindow;
                const runtimeErrors = [];
                win.addEventListener('error', event => runtimeErrors.push(event.message));
                win.addEventListener('unhandledrejection', event => runtimeErrors.push(event.reason?.message || String(event.reason)));
                check(!win.document.getElementById('bootStatus')?.classList.contains('is-error'), '应用初始化无启动错误');
                check(Boolean(win.SoraDiagnostics && win.SoraPerformance && win.SoraReusableBlocks && win.SoraComponentLibrary && win.SoraExtensionPacks && win.SoraKnowledgeBaseInterop), '扩展模块完整加载');

                const longBody = `<h2 id="intro">开始</h2>${'<p>用于验证目录滚动恢复的长段落。</p>'.repeat(180)}<a href="#" data-sora-link="method" data-sora-methods='[{"methodId":"e2e_method","methodType":"show_message","trigger":"click","message":"ok"}]'>测试方法</a>`;
                const data = [['mulu', '首页', 'e2e_root', longBody], ['mulu', '第二页', 'e2e_second', '<h2>第二页</h2><p>内容</p>']];
                win.eval(`mulufile = ${JSON.stringify(data)}; rebuildMulufileIndex(); currentMuluName = null; LoadMulu();`);
                await win.DirectoryNavigation.open('e2e_root', { viewMode: 'top' });
                win.PublicationSettings.open();
                await wait(30);
                let dialogBody = win.document.querySelector('.feature-dialog-body');
                check(dialogBody.scrollWidth <= dialogBody.clientWidth + 1, '发布设置弹窗无横向溢出', `${dialogBody.scrollWidth}/${dialogBody.clientWidth}`);
                check(!Array.from(dialogBody.querySelectorAll('label > span')).some(item => item.textContent === '主题'), '发布设置不再显示主题选项');
                win.FeatureDialog.close();
                win.DirectoryMetadata.openEditor('e2e_root');
                await wait(30);
                dialogBody = win.document.querySelector('.feature-dialog-body');
                check(dialogBody.scrollWidth <= dialogBody.clientWidth + 1, '目录字段弹窗无横向溢出', `${dialogBody.scrollWidth}/${dialogBody.clientWidth}`);
                win.FeatureDialog.close();
                const linkDialogResult = win.showLinkConfigDialog('dir:e2e_root', '编辑链接');
                await poll(() => !win.document.querySelector('.reference-picker-panel')?.hidden);
                const referenceScope = win.document.querySelector('.reference-picker-scope');
                const referencePanel = win.document.querySelector('.reference-picker-panel');
                referenceScope.focus();
                await wait(180);
                check(!referencePanel.hidden, '链接范围下拉框获得焦点时不关闭候选面板');
                referenceScope.value = 'current';
                referenceScope.dispatchEvent(new Event('change', { bubbles: true }));
                await wait(30);
                check(!referencePanel.hidden, '切换链接搜索范围后候选面板保持展开');
                win.document.getElementById('customDialogCancel').click();
                await linkDialogResult;
                const preview = win.document.querySelector('.markdown-preview');
                preview.style.setProperty('height', '240px', 'important');
                preview.style.setProperty('max-height', '240px', 'important');
                preview.style.setProperty('flex', '0 0 240px', 'important');
                preview.style.setProperty('overflow', 'auto', 'important');
                preview.scrollTop = 520;
                await wait(50);
                await win.DirectoryNavigation.open('e2e_second', { viewMode: 'top' });
                await win.DirectoryNavigation.open('e2e_root', { viewMode: 'restore' });
                check(preview.scrollTop > 300, '目录切换恢复滚动位置', `scrollTop=${Math.round(preview.scrollTop)}`);
                const beforeRepeat = preview.scrollTop;
                await win.DirectoryNavigation.open('e2e_root', { viewMode: 'restore' });
                check(Math.abs(preview.scrollTop - beforeRepeat) < 20, '再次打开当前目录不回顶部');

                const methodEntries = win.SoraMethodWorkbench.collectEntries();
                check(methodEntries.some(entry => entry.method.methodId === 'e2e_method'), '方法配置可再次扫描编辑');
                win.SoraMethodWorkbench.openManager();
                await wait(50);
                check(Array.from(win.document.querySelectorAll('[data-action-name="edit"]')).some(button => button.textContent.includes('编辑')), '方法管理显示编辑动作');
                win.FeatureDialog.close();

                win.FeatureDialog.open('层级回归', '用于验证嵌套反馈');
                const nestedConfirm = win.customConfirm('确认框应显示在功能弹窗之上');
                await poll(() => win.document.getElementById('customDialogOverlay')?.classList.contains('active'));
                const featureLayer = Number(getComputedStyle(win.document.querySelector('.feature-dialog-overlay')).zIndex);
                const customLayer = Number(getComputedStyle(win.document.getElementById('customDialogOverlay')).zIndex);
                win.showToast('层级提示', 'info', 500);
                const toastLayer = Number(getComputedStyle(win.document.getElementById('toastContainer')).zIndex);
                const liveToast = win.document.querySelector('#toastContainer .toast:last-child');
                check(customLayer > featureLayer && toastLayer > customLayer, '确认框和提示不会被功能弹窗遮挡', `${featureLayer}/${customLayer}/${toastLayer}`);
                check(liveToast?.getAttribute('role') === 'status', 'Toast 状态可被辅助技术感知');
                win.document.getElementById('customDialogCancel').click();
                await nestedConfirm;
                win.FeatureDialog.close();

                preview.innerHTML = '<p><a href="https://example.com" data-test-link>链接文字</a></p>';
                const linkForColor = preview.querySelector('[data-test-link]');
                const linkColorRange = win.document.createRange();
                linkColorRange.selectNode(linkForColor);
                const linkColorSelection = win.getSelection();
                linkColorSelection.removeAllRanges();
                linkColorSelection.addRange(linkColorRange);
                win.eval('selectionRange = null');
                const originalColorPickerDialog = win.colorPickerDialog;
                win.colorPickerDialog = async () => '#B91C1C';
                try { await win.applyFormat('color'); }
                finally { win.colorPickerDialog = originalColorPickerDialog; }
                const coloredLink = preview.querySelector('[data-test-link]');
                check(coloredLink?.style.color === 'rgb(185, 28, 28)' && getComputedStyle(coloredLink).color === 'rgb(185, 28, 28)', '完整选中链接文字后可直接改变链接颜色');
                const invalidPack = win.SoraExtensionPacks.validate({ type: 'SoraExtensionPack', version: 1, name: '未声明能力', capabilities: [], componentPresets: [{ name: '问答', type: 'faq', label: '常见问题' }] });
                check(invalidPack.errors.some(error => error.includes('未声明 component-presets 能力')), '扩展包内容必须匹配能力声明');
                const installedPack = win.SoraExtensionPacks.install({ type: 'SoraExtensionPack', version: 1, id: 'e2e-components', name: 'E2E 组件', capabilities: ['component-presets'], componentPresets: [{ name: '问答预设', type: 'faq', label: '常见问题' }] });
                check(installedPack.errors.length === 0 && win.SoraExtensionPacks.getComponentPresets().length === 1, '扩展包组件预设可安装并被组件库读取');
                preview.innerHTML = '<p><span id="component-start" class="sora-anchor" data-sora-anchor="true" data-anchor-name="component-start">\u200B</span><strong>组件内容</strong><span id="component-end" class="sora-anchor" data-sora-anchor="true" data-anchor-name="component-end">\u200B</span></p>';
                win.syncPreviewToTextarea();
                win.SoraReferencePicker.clearCache();
                win.SoraComponentLibrary.open();
                await poll(() => win.document.querySelector('[data-component-error]'));
                const componentPreset = win.document.querySelector('[data-preset]');
                componentPreset.value = '0';
                componentPreset.dispatchEvent(new Event('change', { bubbles: true }));
                check(win.document.querySelector('[data-type]').value === 'faq' && win.document.querySelector('[data-label]').value === '常见问题', '扩展包组件预设可在组件库中选择并回填');
                win.document.querySelector('[data-insert]').click();
                check(win.document.querySelector('[data-component-error]').textContent.includes('前锚点'), '组件缺少锚点时在弹窗内显示原因');
                const componentFront = win.document.querySelector('[data-front]');
                const componentBack = win.document.querySelector('[data-back]');
                componentFront.value = '#component-start';
                componentBack.value = '#component-end';
                componentFront.dispatchEvent(new Event('input', { bubbles: true }));
                componentBack.dispatchEvent(new Event('input', { bubbles: true }));
                win.document.querySelector('[data-insert]').click();
                await poll(() => !win.document.querySelector('.feature-dialog-overlay')?.classList.contains('active'));
                const componentMethodLink = preview.querySelector('a[data-sora-link="method"]');
                const componentMethods = JSON.parse(componentMethodLink?.dataset.soraMethods || '[]');
                check(componentMethods[0]?.methodType === '插入组件' && componentMethods[0]?.componentType === 'faq' && componentMethods[0]?.frontAnchor === '#component-start' && componentMethods[0]?.backAnchor === '#component-end', '有效锚点可插入受控组件方法');
                preview.innerHTML = '<p>引用插入位置</p>';
                win.syncPreviewToTextarea();
                win.SoraReusableBlocks.open();
                await poll(() => win.document.querySelector('[data-block-error]'));
                win.document.querySelector('.feature-dialog-body .method-workbench-actions button').click();
                await poll(() => !win.document.querySelector('.feature-dialog-overlay')?.classList.contains('active'));
                const reusableBlock = preview.querySelector('[data-sora-block-ref="e2e_second"]');
                check(reusableBlock?.textContent.includes('第二页') && reusableBlock.querySelector('[data-edit-sora-block="e2e_second"]'), '可复用内容块可实际插入、展开并返回源目录');
                preview.innerHTML = longBody;
                win.syncPreviewToTextarea();

                const issues = await win.collectExportPreflightIssues(data);
                check(Boolean(issues && Array.isArray(issues.invalidMethods)), '导出预检可重复运行');
                const inventory = await win.SoraPerformance.analyze(data, { force: true });
                check(inventory.rows === 2 && inventory.durationMs >= 0, 'Worker/回退性能清单可运行', `${inventory.durationMs.toFixed(1)}ms`);

                const mediaId = await win.MediaStorage.save(new win.Blob(['e2e-media'], { type: 'image/png' }), 'image');
                const mediaBlob = await win.MediaStorage.getChunkedBlob(mediaId);
                check(Boolean(mediaId && mediaBlob && mediaBlob.size), '媒体写入与读取');

                const currentData = win.eval('mulufile.map(row => row.slice())');
                const packageBlob = await win.buildSoraPackageBlob(currentData);
                const packageResult = await win.readSoraPackageManifest(new File([packageBlob], 'roundtrip.sora'));
                check(packageResult.manifest.directories.length === 2, '.sora 保存与清单读取往返');

                win.eval('markUnsavedChanges()');
                await win.DraftManager.saveNow();
                await win.DraftManager.createNamedSnapshot('浏览器回归');
                const snapshots = await win.DraftManager.listSnapshots();
                check(snapshots.some(item => item.snapshotName === '浏览器回归'), '按文档身份创建命名快照');

                const kb = win.SoraKnowledgeBaseInterop;
                check(kb.safeStem('a:b?c') === 'a-b-c', 'Markdown 文件名净化');
                const parsed = kb.parseFrontMatter('---\ntitle: "样例"\ntags: ["a"]\n---\n# 正文');
                check(parsed.data.title === '样例' && parsed.body.includes('# 正文'), 'Front Matter 解析');
                check(kb.findCycles(new Map([['a', ['b']], ['b', ['a']]])).length === 1, '知识库循环链接预检');

                async function captureExport(exportRows, settings) {
                    const parts = [];
                    win.showSaveFilePicker = async () => ({ name: 'e2e.html', createWritable: async () => ({ write: async part => parts.push(part), close: async () => {}, abort: async () => {} }) });
                    const originalResolve = win.PublicationSettings.resolve;
                    win.PublicationSettings.resolve = () => settings;
                    try { await win.handleSaveAsWebpage(false, null, exportRows, { mode: 'all' }); }
                    finally { win.PublicationSettings.resolve = originalResolve; }
                    return new Blob(parts, { type: 'text/html' }).text();
                }
                const settings = { title: 'E2E', description: '', icon: '', language: 'zh-CN', theme: 'light', defaultDirId: 'e2e_root', initialTreeState: 'expanded', navigationMode: 'sidebar', capabilityLevel: 'standard', searchEnabled: true, mediaPolicy: 'balanced', deploymentMode: 'single-html', debugEnabled: false };
                const exported = await captureExport(data, settings);
                check(exported.includes('createSoraMethodRuntimeCore') && exported.includes('data-sora-methods'), '有方法导出包含共享运行核心', `length=${exported.length},core=${exported.includes('createSoraMethodRuntimeCore')},method=${exported.includes('data-sora-methods')}`);
                check(!exported.includes('sora-method-debug-button">方法调试'), '标准发布不显示调试入口');
                const compactRows = [['mulu', '纯阅读', 'plain', '<h1>纯阅读</h1><p>内容</p>']];
                const compact = await captureExport(compactRows, { ...settings, defaultDirId: 'plain', capabilityLevel: 'compact', searchEnabled: false });
                check(!compact.includes('function executeSingleMethod') && compact.includes('function handleSoraMethodTriggersCascade() {}'), '无方法精简导出裁剪方法运行适配');
                check(!compact.includes('id="exportSearchInput"'), '精简导出裁剪搜索界面');

                const reader = document.createElement('iframe');
                reader.style.width = viewport === 'mobile' ? '360px' : '1100px';
                reader.style.height = '640px';
                document.body.appendChild(reader);
                reader.srcdoc = exported;
                await poll(() => reader.contentDocument?.querySelector('.content-body')?.textContent.includes('开始'), 10000);
                check(Boolean(reader.contentDocument.querySelector('main[role="main"], main')), '导出网页真实运行并显示正文');
                const sidebarCollapseButton = reader.contentDocument.getElementById('sidebarCollapseBtn');
                check(Boolean(reader.contentDocument.getElementById('readingTools') && sidebarCollapseButton), '折叠的目录工具入口可用');
                check(!reader.contentDocument.getElementById('readingModeBtn') && !reader.contentDocument.getElementById('printPageBtn'), '导出页不再提供强制居中阅读模式和打印入口');
                check(!reader.contentDocument.documentElement.hasAttribute('data-theme'), '导出页不再暴露多主题外观');
                check(getComputedStyle(reader.contentDocument.body).backgroundColor === 'rgb(255, 255, 255)', '导出页固定旧版浅色背景');
                if (viewport === 'mobile') check(getComputedStyle(reader.contentDocument.getElementById('mobileNavToggle')).display !== 'none', '移动宽度显示目录抽屉按钮');
                else {
                    const exportSidebar = reader.contentDocument.getElementById('exportSidebar');
                    const contentBody = reader.contentDocument.getElementById('contentBody');
                    check(Boolean(reader.contentDocument.querySelector('[role="tree"]')), '桌面宽度显示语义目录树');
                    sidebarCollapseButton.click();
                    await poll(() => exportSidebar.getBoundingClientRect().width <= 1, 2000);
                    check(exportSidebar.getBoundingClientRect().width <= 1 && sidebarCollapseButton.textContent === '展开目录', '桌面工具只收起目录并释放正文空间');
                    check(getComputedStyle(contentBody).paddingLeft === '20px' && getComputedStyle(contentBody).paddingRight === '20px', '收起目录不改变正文对齐和边距');
                    sidebarCollapseButton.click();
                    await poll(() => exportSidebar.getBoundingClientRect().width >= 200, 2000);
                    check(exportSidebar.getBoundingClientRect().width >= 200 && sidebarCollapseButton.textContent === '收起目录', '桌面目录可再次展开');
                }

                await win.DraftManager.clear();
                await win.MediaStorage.deleteMedia(mediaId);
                localStorage.removeItem('sora_extension_packs_v1');
                check(runtimeErrors.length === 0, '场景运行无未处理脚本错误', runtimeErrors.join('；'));
            } catch (error) {
                failures.push(`测试中断：${error.stack || error.message || error}`);
            }
            status.textContent = [...log, ...(failures.length ? ['FAILURES', ...failures] : ['ALL PASSED'])].join('\n');
            document.body.dataset.testStatus = failures.length ? 'failed' : 'passed';
            document.title = failures.length ? 'SoraDirectory E2E FAILED' : 'SoraDirectory E2E PASSED';
        })();
    </script>
</body>
</html>
